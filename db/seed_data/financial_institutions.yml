# Colombian financial institutions catalog.
#
# Fields:
#   canonical_name - commercial name (unique). The name users recognize.
#   slug           - stable unique identifier (seeds-managed, set at creation).
#   institution_type - bank / digital_bank / digital_wallet /
#                      financing_company / other. Seed-managed catalog data.
#   aliases        - candidate matching values (NOT guaranteed to be in use).
#   domains        - verified official domains (candidate signals, not proof
#                    that an email is a transaction notification).
#   keywords       - well-known product/brand words that point to the
#                    institution. Only verified, widely-known values belong
#                    here; leave empty when unsure.
#   active         - disabled entries are ignored by matching. The seeder only
#                    applies `active` at creation: entities disabled manually
#                    are never silently re-activated by a seed run.
#
# The seeder (db/seed_data/financial_catalog_seeder.rb) upserts by
# canonical_name and is idempotent.
#
# Brand-careful rules honored by this file:
#   * A brand that legally belongs to another entity may still be a separate
#     catalog row when users know it as its own product (see Nequi vs
#     Bancolombia, DaviPlata vs Davivienda, DAVIbank vs Davivienda). The brand
#     alias moves to the standalone row (never listed twice) so matching and
#     bank-text migration stay unambiguous.
#   * Renamed/bought entities are separate rows (Citibank Colombia,
#     Banco J.P. Morgan Colombia) — legal successors are NOT merged silently.
#   * Generic everyday words (dale, tuya, iris, koa, bold) are excluded from
#     `aliases` to avoid false matches; their canonical names still resolve
#     for the selector and the bank-text migration.
#   * Domains are listed only when reasonably confirmed; never invented.
#   * Classification (`institution_type`) follows the provider scene as
#     best known; entries needing legal verification should not diverge much
#     from the catalog taxonomy even if the classification is debatable.
institutions:
  # ── Bancos tradicionales y comerciales ──────────────────────────────
  - canonical_name: Bancolombia
    slug: bancolombia
    institution_type: bank
    aliases: [bancolombia, banco de colombia]
    domains: [bancolombia.com, grupobancolombia.com]
    keywords: []
    active: true

