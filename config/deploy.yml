<% server = ENV.fetch("KAMAL_SERVER") %>
<% host = ENV.fetch("KAMAL_HOST") %>
<% registry_user = ENV.fetch("KAMAL_REGISTRY_USERNAME") %>

service: expense-tracker
image: <%= registry_user %>/expense-tracker

servers:
  web:
    hosts:
      - <%= server %>
    options:
      cap-drop: ALL
      security-opt: no-new-privileges

proxy:
  ssl: true
  host: <%= host %>
  forward_headers: true
  healthcheck:
    path: /up

registry:
  server: ghcr.io
  username: <%= registry_user %>
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

ssh:
  user: deploy
  keys:
    - ~/.ssh/yogasto_deploy_key

env:
  clear:
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: "true"
    RAILS_SERVE_STATIC_FILES: "true"
    RAILS_MAX_THREADS: "3"
    SOLID_QUEUE_IN_PUMA: "true"
    DATABASE_HOST: 172.30.0.1
    DATABASE_PORT: "5432"
    DATABASE_USERNAME: expense_tracker
    DATABASE_NAME: expense_tracker_production
    CACHE_DATABASE_NAME: expense_tracker_cache_production
    APP_HOST: <%= host %>
    RAILS_PUBLIC_HOSTS: <%= host %>
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_PASSWORD
    - ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
    - ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
    - ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
    - AI_CHEAP_CONFIDENCE_THRESHOLD
    - AI_CHEAP_MODEL
    - AI_CHEAP_PROVIDER
    - AI_DISABLE_CATEGORY_FILL
    - AI_DISABLE_STRONG_TIER
    - APP_NAME
    - CLIKUP_API_TOKEN
    - CLOUDFLARE_API_TOKEN
    - FB_APP_ID
    - FB_APP_SECRET
    - FB_VERIFY_TOKEN
    - FFMPEG_BIN
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
    - INBOUND_EMAIL_MAX_BYTES
    - INBOUND_EMAIL_RECIPIENT
    - INBOUND_EMAIL_SECRET
    - INBOUND_EMAIL_USER_EMAIL
    - INBOUND_EMAIL_USER_MAP
    - MAIL_INBOUND_PROVIDER
    - MISTRAL_API_KEY
    - MISTRAL_MODEL
    - OPENROUTER_API_KEY
    - OPENROUTER_APP_NAME
    - PREMIUM_IDENTITY_HMAC_SECRET
    - RESEND_API_KEY
    - RESEND_WEBHOOK_SECRET
    - SPEECH_TO_TEXT_PROVIDER
    - TESSERACT_BIN
    - USE_SSL
    - WHATSAPP_ACCESS_TOKEN
    - WHATSAPP_BUSINESS_NUMBER
    - WHATSAPP_BUSINESS_PHONE_NUMBER_ID
    - WHATSAPP_VERIFY_TOKEN
    - WHISPER_LANGUAGE
    - WHISPER_MODEL
