# Solid Cable (Action Cable pub/sub) runs on the primary database, matching
# how Solid Queue is deployed in this app: no separate database, no Redis.
development:
  adapter: solid_cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

test:
  adapter: test

production:
  adapter: solid_cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
