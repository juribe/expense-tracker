# PostgreSQL. Versions 12 and up are supported.
#
# Connection settings can be provided individually via environment variables
# (DATABASE_HOST, DATABASE_PORT, DATABASE_USERNAME, DATABASE_PASSWORD) or all
# at once through DATABASE_URL, e.g.:
#   DATABASE_URL=postgres://user:password@host:5432/dbname
# When DATABASE_URL is set it overrides the per-database config below.
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", ENV.fetch("USER", "postgres")) %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "") %>

development:
  primary:
    <<: *default
    database: expense_tracker_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *default
    database: expense_tracker_test

# Store production database credentials via DATABASE_URL / environment
# variables; never commit secrets to the repository.
production:
  primary:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME", "expense_tracker_production") %>
