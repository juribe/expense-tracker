# Recurring (scheduled) Solid Queue tasks.
#
# Schedule syntax follows Fugit cron-like expressions accepted by SolidQueue::RecurringTask.
#   https://github.com/rails/solid_queue

# Shared set of recurring tasks.
# The dispatcher enqueues one GmailSyncJob per active connection, so each
# user's mailbox is synchronized in its own job.
gmail_sync: &gmail_sync
  class: GmailSyncDispatchJob
  queue: default
  schedule: every 15 minutes

# Expires PaymentEngine memberships whose access period is over.
payment_engine_membership_expiration: &payment_engine_membership_expiration
  class: PaymentEngine::ExpireMembershipsJob
  queue: default
  schedule: every 15 minutes

# Drops inbound email content that outlived its processing lifecycle.
mail_inbound_content_purge: &mail_inbound_content_purge
  class: MailInboundContentPurgeJob
  queue: default
  schedule: every hour

# Drops WhatsApp message-id claims past the redelivery window.
whatsapp_inbound_message_purge: &whatsapp_inbound_message_purge
  class: WhatsappInboundMessagePurgeJob
  queue: default
  schedule: every day at 3am

development:
  gmail_sync:
    <<: *gmail_sync
  payment_engine_membership_expiration:
    <<: *payment_engine_membership_expiration
  mail_inbound_content_purge:
    <<: *mail_inbound_content_purge
  whatsapp_inbound_message_purge:
    <<: *whatsapp_inbound_message_purge

test:
  gmail_sync:
    <<: *gmail_sync
  payment_engine_membership_expiration:
    <<: *payment_engine_membership_expiration
  mail_inbound_content_purge:
    <<: *mail_inbound_content_purge
  whatsapp_inbound_message_purge:
    <<: *whatsapp_inbound_message_purge

production:
  gmail_sync:
    <<: *gmail_sync
  payment_engine_membership_expiration:
    <<: *payment_engine_membership_expiration
  mail_inbound_content_purge:
    <<: *mail_inbound_content_purge
  whatsapp_inbound_message_purge:
    <<: *whatsapp_inbound_message_purge
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
