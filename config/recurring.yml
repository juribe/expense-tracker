# Recurring (scheduled) Solid Queue tasks.
#
# Schedule syntax follows Fugit cron-like expressions accepted by SolidQueue::RecurringTask.
#   https://github.com/rails/solid_queue

# Shared set of recurring tasks.
gmail_sync: &gmail_sync
  class: GmailSyncJob
  queue: default
  schedule: every 15 minutes

development:
  gmail_sync:
    <<: *gmail_sync

test:
  gmail_sync:
    <<: *gmail_sync

production:
  gmail_sync:
    <<: *gmail_sync
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
