<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review: Expense Form Design - Mockup</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .navbar-brand { font-weight: 700; }
    .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .btn { border-radius: 8px; }
    .mockup-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="#"><i class="bi bi-app"></i> App</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link active" href="#"><i class="bi bi-house"></i> Home</a>
      </div>
    </div>
  </nav>
  <div class="mockup-container">
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Expense Tracker</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link active" aria-current="page" href="#">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Expenses</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Reports</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Settings</a></li>
      </ul>
    </div>
  </div>
</nav>

<section class="container py-4">
  <form class="row g-3 needs-validation" novalidate>
    <h2 class="col-12 text-primary mb-3">Add New Expense</h2>

    <div class="col-md-6">
      <label for="expenseDate" class="form-label">Date</label>
      <input type="date" class="form-control" id="expenseDate" required value="2024-08-19">
      <div class="invalid-feedback">Please select a date.</div>
    </div>

    <div class="col-md-6">
      <label for="amount" class="form-label">Amount ($)</label>
      <input type="number" step="0.01" min="0" class="form-control" id="amount" placeholder="50.00" required>
      <div class="invalid-feedback">Please enter a valid amount.</div>
    </div>

    <div class="col-md-6">
      <label for="category" class="form-label">Category</label>
      <select class="form-select" id="category" required>
        <option value="">Choose...</option>
        <option value="travel" selected>Travel</option>
        <option value="meals">Meals</option>
        <option value="office_supplies">Office Supplies</option>
        <option value="utilities">Utilities</option>
        <option value="entertainment">Entertainment</option>
      </select>
      <div class="invalid-feedback">Please select a category.</div>
    </div>

    <div class="col-md-6">
      <label for="description" class="form-label">Description</label>
      <input type="text" class="form-control" id="description" placeholder="Flight to NYC" required>
      <div class="invalid-feedback">Please provide a description.</div>
    </div>

    <div class="col-12">
      <label for="receipt" class="form-label">Receipt (optional)</label>
      <div class="input-group">
        <input type="file" class="form-control" id="receipt" accept="image/*,application/pdf">
        <span class="input-group-text"><i class="bi bi-upload"></i></span>
      </div>
      <div class="invalid-feedback">Please upload a valid receipt file.</div>
    </div>

    <div class="col-12">
      <label for="notes" class="form-label">Notes</label>
      <textarea class="form-control" id="notes" rows="3" placeholder="Additional details..."></textarea>
    </div>

    <div class="col-12 d-flex justify-content-end">
      <a href="#" class="btn btn-outline-secondary me-2">Cancel</a>
      <button type="submit" class="btn btn-primary">Save Expense</button>
    </div>
  </form>
</section>

<script>
  (() => {
    'use strict'
    const forms = document.querySelectorAll('.needs-validation')
    Array.from(forms).forEach(form => {
      form.addEventListener('submit', event => {
        if (!form.checkValidity()) {
          event.preventDefault()
          event.stopPropagation()
        }
        form.classList.add('was-validated')
      }, false)
    })
  })()
</script>
  </div>
  <footer class="text-center text-muted py-4 mt-5">
    <small>Mockup generated by AI Designer</small>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
