<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category Form Design and Implementation - Mockup</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .navbar-brand { font-weight: 700; }
    .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .btn { border-radius: 8px; }
    .mockup-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="#"><i class="bi bi-app"></i> App</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link active" href="#"><i class="bi bi-house"></i> Home</a>
      </div>
    </div>
  </nav>
  <div class="mockup-container">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#"><i class="bi bi-box-seam me-2"></i>MyApp</a>
  </div>
</nav>

<div class="container-fluid py-4" style="max-width: 960px;">
  <div class="mx-auto">
    <div class="card shadow-sm border-0">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0"><i class="bi bi-pencil-square me-2"></i>Create / Edit Category</h5>
      </div>
      <div class="card-body">
        <form novalidate>
          <div class="row g-3">
            <!-- Category Name -->
            <div class="col-12 col-md-6">
              <label for="categoryName" class="form-label">
                Category Name <span class="text-danger">*</span>
              </label>
              <input type="text" class="form-control is-invalid" id="categoryName" placeholder="Enter category name"
                     value="Electronics">
              <div class="invalid-feedback">
                Category name is required and must be at least 3 characters.
              </div>
            </div>

            <!-- Parent Category -->
            <div class="col-12 col-md-6">
              <label for="parentCategory" class="form-label">Parent Category</label>
              <select class="form-select" id="parentCategory">
                <option selected disabled>Choose parent...</option>
                <option>Home & Garden</option>
                <option>Fashion</option>
                <option>Sports</option>
                <option>Books</option>
              </select>
            </div>

            <!-- Description -->
            <div class="col-12">
              <label for="description" class="form-label">Description</label>
              <textarea class="form-control" id="description" rows="3"
                        placeholder="Brief description of the category...">All electronic devices and accessories.</textarea>
            </div>

            <!-- Status -->
            <div class="col-12 col-md-6">
              <label class="form-label d-block">Status</label>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="status" id="statusActive" value="active" checked>
                <label class="form-check-label" for="statusActive">Active</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="status" id="statusInactive" value="inactive">
                <label class="form-check-label" for="statusInactive">Inactive</label>
              </div>
            </div>

            <!-- Image Upload -->
            <div class="col-12 col-md-6">
              <label for="categoryImage" class="form-label">Category Image</label>
              <input class="form-control" type="file" id="categoryImage" accept="image/*">
              <div class="form-text">Recommended size: 400 × 400 px.</div>
            </div>

            <!-- Action Buttons -->
            <div class="col-12 d-flex justify-content-end pt-2">
              <button type="reset" class="btn btn-outline-secondary me-2">
                <i class="bi bi-x-circle me-1"></i>Cancel
              </button>
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-save me-1"></i>Save
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </div>
  <footer class="text-center text-muted py-4 mt-5">
    <small>Mockup generated by AI Designer</small>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
