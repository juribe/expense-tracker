name: Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RAILS_ENV: test
  DATABASE_HOST: 127.0.0.1
  DATABASE_PORT: "5432"
  DATABASE_USERNAME: postgres
  DATABASE_PASSWORD: postgres
  # The suite must not run in parallel here to keep the database isolated.
  DISABLE_PARALLEL_TESTS: "1"

jobs:
  minitest:
    name: MiniTest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres: &postgres-service
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Use the latest 3.3.x patch the runner image publishes; the exact
          # 3.3.4 in .ruby-version is not built for newer Ubuntu images.
          ruby-version: "3.3"
          bundler-cache: true

      - name: Prepare test database
        run: bin/rails db:test:prepare

      - name: Run MiniTest
        run: bin/rails test

  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres: *postgres-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      # NOTE (Nov 2026): this runner cannot resolve the Ubuntu mirrors
      # (azure.archive.ubuntu.com / security.ubuntu.com), so `--with-deps`
      # dies inside apt. For now we skip the apt part: the ubuntu-latest image
      # already ships Chromium and the libraries it needs.
      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Prepare Playwright database
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/expense_tracker_playwright
        run: bin/rails db:prepare

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  brakeman:
    name: Brakeman
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Run Brakeman
        run: bundle exec brakeman --no-pager
