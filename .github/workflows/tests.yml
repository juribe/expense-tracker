name: Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RAILS_ENV: test
  DATABASE_HOST: 127.0.0.1
  DATABASE_PORT: "5432"
  DATABASE_USERNAME: postgres
  DATABASE_PASSWORD: postgres
  # The suite must not run in parallel here to keep the database isolated.
  DISABLE_PARALLEL_TESTS: "1"

jobs:
  minitest:
    name: MiniTest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres: &postgres-service
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare test database
        run: bin/rails db:test:prepare

      - name: Run MiniTest
        run: bin/rails test

  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Official Playwright image: browsers and their OS libraries are baked in,
    # so CI no longer downloads browsers or apt-installs browser dependencies
    # (that step kept failing on the runner's Ubuntu mirror DNS).
    # Keep this tag in sync with the @playwright/test version in package-lock.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      # From inside the job container the postgres service is reached by name.
      DATABASE_HOST: postgres
    services:
      postgres: *postgres-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The image has the browsers but not a C toolchain; bcrypt, msgpack,
      # puma and bootsnap build native extensions during bundle install.
      - name: Install build dependencies
        run: |
          for attempt in 1 2 3; do
            if apt-get update && apt-get install -y --no-install-recommends build-essential; then
              exit 0
            fi
            echo "apt attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          exit 1

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare Playwright database
        env:
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/expense_tracker_playwright
        run: bin/rails db:prepare

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  brakeman:
    name: Brakeman
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run Brakeman
        run: bundle exec brakeman --no-pager
