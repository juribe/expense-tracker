name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Kamal deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      KAMAL_SERVER: ${{ secrets.KAMAL_SERVER }}
      KAMAL_HOST: ${{ secrets.KAMAL_HOST }}
      KAMAL_REGISTRY_USERNAME: ${{ github.repository_owner }}
      KAMAL_REGISTRY_PASSWORD: ${{ github.token }}
      KAMAL_SSH_PRIVATE_KEY: ${{ secrets.KAMAL_SSH_PRIVATE_KEY }}
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Configure Kamal secrets
        run: |
          mkdir -p .kamal
          cp .kamal/secrets.example .kamal/secrets
          chmod 600 .kamal/secrets

      - name: Deploy with Kamal
        run: bundle exec kamal setup
