
name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_lock:
        description: Release a stale Kamal deploy lock before deploying
        type: boolean
        default: false
      dump_logs:
        description: Only print the deployed application logs
        type: boolean
        default: false
      setup_cms:
        description: Create the Maglev site when missing and publish its pages
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Kamal deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    env:
      KAMAL_SERVER: ${{ secrets.KAMAL_SERVER }}
      KAMAL_HOST: ${{ secrets.KAMAL_HOST }}
      KAMAL_REGISTRY_USERNAME: ${{ github.repository_owner }}
      KAMAL_REGISTRY_PASSWORD: ${{ github.token }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY }}
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT }}
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY }}
      AI_CHEAP_CONFIDENCE_THRESHOLD: ${{ secrets.AI_CHEAP_CONFIDENCE_THRESHOLD }}
      AI_CHEAP_MODEL: ${{ secrets.AI_CHEAP_MODEL }}
      AI_CHEAP_PROVIDER: ${{ secrets.AI_CHEAP_PROVIDER }}
      AI_DISABLE_CATEGORY_FILL: ${{ secrets.AI_DISABLE_CATEGORY_FILL }}
      AI_DISABLE_STRONG_TIER: ${{ secrets.AI_DISABLE_STRONG_TIER }}
      APP_NAME: ${{ secrets.APP_NAME }}
      CLIKUP_API_TOKEN: ${{ secrets.CLIKUP_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FB_APP_ID: ${{ secrets.FB_APP_ID }}
      FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
      FB_VERIFY_TOKEN: ${{ secrets.FB_VERIFY_TOKEN }}
      FFMPEG_BIN: ${{ secrets.FFMPEG_BIN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      INBOUND_EMAIL_MAX_BYTES: ${{ secrets.INBOUND_EMAIL_MAX_BYTES }}
      INBOUND_EMAIL_RECIPIENT: ${{ secrets.INBOUND_EMAIL_RECIPIENT }}
      INBOUND_EMAIL_SECRET: ${{ secrets.INBOUND_EMAIL_SECRET }}
      INBOUND_EMAIL_USER_EMAIL: ${{ secrets.INBOUND_EMAIL_USER_EMAIL }}
      INBOUND_EMAIL_USER_MAP: ${{ secrets.INBOUND_EMAIL_USER_MAP }}
      MAIL_INBOUND_PROVIDER: ${{ secrets.MAIL_INBOUND_PROVIDER }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      MISTRAL_MODEL: ${{ secrets.MISTRAL_MODEL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_APP_NAME: ${{ secrets.OPENROUTER_APP_NAME }}
      PREMIUM_IDENTITY_HMAC_SECRET: ${{ secrets.PREMIUM_IDENTITY_HMAC_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
      SPEECH_TO_TEXT_PROVIDER: ${{ secrets.SPEECH_TO_TEXT_PROVIDER }}
      TESSERACT_BIN: ${{ secrets.TESSERACT_BIN }}
      USE_SSL: ${{ secrets.USE_SSL }}
      WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
      WHATSAPP_BUSINESS_NUMBER: ${{ secrets.WHATSAPP_BUSINESS_NUMBER }}
      WHATSAPP_BUSINESS_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_BUSINESS_PHONE_NUMBER_ID }}
      WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
      WHISPER_LANGUAGE: ${{ secrets.WHISPER_LANGUAGE }}
      WHISPER_MODEL: ${{ secrets.WHISPER_MODEL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Debug GitHub OIDC claims
        env:
          AUDIENCE: ${{ secrets.TS_AUDIENCE }}
        run: |
          RESPONSE=$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          echo "$TOKEN" | cut -d. -f2 | \
            base64 -d 2>/dev/null | \
            jq '{iss, sub, aud, repository, environment, ref}'

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: 100.107.193.51

      - name: Configure SSH known hosts
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/known_hosts

      - name: Configure SSH private key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/yogasto_deploy_key
          chmod 600 ~/.ssh/yogasto_deploy_key
          ssh-keygen -y -f ~/.ssh/yogasto_deploy_key > /dev/null

      # Kamal only reads secrets from .kamal/secrets; environment variables are
      # not used directly. The file holds references, not values, for every
      # secret declared in config/deploy.yml plus the registry password.
      - name: Write Kamal secrets file
        run: |
          umask 077
          mkdir -p .kamal
          bundle exec ruby -e '
            require "pathname"
            require "kamal"

            config = Kamal::Configuration.create_from(config_file: Pathname("config/deploy.yml"))
            names = config.env.secret_keys.map { |key| key.split(":", 2).first }
            names << "KAMAL_REGISTRY_PASSWORD"
            names.uniq!

            missing = names.reject { |name| ENV[name].to_s.strip.present? }
            abort "Missing environment values for: #{missing.join(", ")}" if missing.any?

            File.open(".kamal/secrets", "w", 0600) do |file|
              names.each { |name| file.puts "#{name}=$#{name}" }
            end
          '

      - name: Check RAILS_MASTER_KEY format
        run: |
          bundle exec ruby -e '
            key = ENV.fetch("RAILS_MASTER_KEY")
            unless key.match?(/\A[0-9a-f]{32}\z/i)
              abort "RAILS_MASTER_KEY must be the 32-character hex key from config/master.key (got #{key.length} characters)."
            end
          '

      - name: Verify production boot
        run: RAILS_ENV=production bundle exec ruby -e 'require "./config/environment"; puts "production boot ok"'

      - name: Release stale deploy lock
        if: inputs.release_lock
        run: bundle exec kamal lock release

      - name: Dump application logs
        if: inputs.dump_logs
        run: bundle exec kamal app logs --lines 200

      - name: Set up the CMS site
        if: inputs.setup_cms
        run: bundle exec kamal app exec --reuse "bin/rails yogasto:create_cms_site"

      - name: Deploy with Kamal
        if: ${{ !inputs.dump_logs && !inputs.setup_cms }}
        run: bundle exec kamal setup

      # Temporary: keep the public data deletion page and its footer link in
      # sync on every deploy until the content and the editor flow are verified.
      # Both tasks are idempotent and preserve existing Maglev content.
      - name: Publish the data deletion page
        if: ${{ !inputs.dump_logs && !inputs.setup_cms }}
        run: bundle exec kamal app exec --reuse "bin/rails yogasto:setup_data_deletion"

      - name: Link the data deletion page in the footer
        if: ${{ !inputs.dump_logs && !inputs.setup_cms }}
        run: bundle exec kamal app exec --reuse "bin/rails yogasto:link_data_deletion_in_footer"
