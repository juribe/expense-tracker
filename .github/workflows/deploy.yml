
name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Kamal deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    env:
      KAMAL_SERVER: ${{ secrets.KAMAL_SERVER }}
      KAMAL_HOST: ${{ secrets.KAMAL_HOST }}
      KAMAL_REGISTRY_USERNAME: ${{ github.repository_owner }}
      KAMAL_REGISTRY_PASSWORD: ${{ github.token }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Debug GitHub OIDC claims
        env:
          AUDIENCE: ${{ secrets.TS_AUDIENCE }}
        run: |
          RESPONSE=$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          echo "$TOKEN" | cut -d. -f2 | \
            base64 -d 2>/dev/null | \
            jq '{iss, sub, aud, repository, environment, ref}'

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: 100.107.193.51

      - name: Configure SSH known hosts
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/known_hosts

      - name: Configure SSH private key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/yogasto_deploy_key
          chmod 600 ~/.ssh/yogasto_deploy_key
          ssh-keygen -y -f ~/.ssh/yogasto_deploy_key > /dev/null

      - name: Deploy with Kamal
        run: bundle exec kamal setup
