<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .navbar-brand { font-weight: 700; }
    .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .btn { border-radius: 8px; }
    .mockup-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="#"><i class="bi bi-app"></i> App</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link active" href="#"><i class="bi bi-house"></i> Home</a>
      </div>
    </div>
  </nav>
  <div class="mockup-container">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="#">
      <i class="bi bi-wallet2 me-2"></i>
      <strong>SpendWise</strong>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link active" href="#">Dashboard</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Reports</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Settings</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8 col-xl-6">
      
      <!-- Add Expense Card -->
      <div class="card border-0 shadow-lg">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center border-bottom-0">
          <h5 class="mb-0 fw-bold text-dark">
            <i class="bi bi-plus-circle text-primary me-2"></i>Add New Expense
          </h5>
          <button type="button" class="btn-close" aria-label="Close"></button>
        </div>

        <div class="card-body p-4">
          <form id="expenseForm">
            
            <!-- Amount Input Group -->
            <div class="mb-4">
              <label class="form-label fw-semibold text-secondary small text-uppercase">Amount</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text bg-light border-end-0 text-primary fw-bold">$</span>
                <input type="number" class="form-control border-start-0 ps-0" placeholder="0.00" step="0.01">
              </div>
              <div class="form-text">Enter the total amount spent.</div>
            </div>

            <!-- Description Input -->
            <div class="mb-4">
              <label class="form-label fw-semibold text-secondary small text-uppercase">Description</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-pencil"></i></span>
                <input type="text" class="form-control" placeholder="e.g. Weekly Groceries">
              </div>
            </div>

            <!-- Category and Date Grid -->
            <div class="row g-3 mb-4">
              <!-- Category Selection -->
              <div class="col-md-6">
                <label class="form-label fw-semibold text-secondary small text-uppercase">Category</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-tag"></i></span>
                  <select class="form-select">
                    <option selected disabled>Select category</option>
                    <option value="food">Food & Dining</option>
                    <option value="transport">Transportation</option>
                    <option value="housing">Housing/Rent</option>
                    <option value="entertainment">Entertainment</option>
                    <option value="utilities">Utilities</option>
                    <option value="other">Other</option>
                  </select>
                </div>
              </div>

              <!-- Date Picker -->
              <div class="col-md-6">
                <label class="form-label fw-semibold text-secondary small text-uppercase">Date</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-calendar-event"></i></span>
                  <input type="date" class="form-control">
                </div>
              </div>
            </div>

            <!-- Note/Memo Field -->
            <div class="mb-4">
              <label class="form-label fw-semibold text-secondary small text-uppercase">Notes (Optional)</label>
              <textarea class="form-control" rows="2" placeholder="Add any additional details..."></textarea>
            </div>

            <!-- Action Buttons -->
            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-5">
              <button type="button" class="btn btn-light px-4 me-md-2">Cancel</button>
              <button type="submit" class="btn btn-primary px-5 shadow-sm">
                <i class="bi bi-check2-circle me-1"></i> Save Expense
              </button>
            </div>

          </form>
        </div>
      </div>

      <!-- Recent Transactions Preview (Small Footer Info) -->
      <div class="mt-4 text-center">
        <p class="text-muted small">
          <i class="bi bi-info-circle me-1"></i> 
          All expenses are synced across your connected devices.
        </p>
      </div>

    </div>
  </div>
</div>

<!-- Bootstrap 5 & Icons via CDN (Required for the mockup to render correctly) -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </div>
  <footer class="text-center text-muted py-4 mt-5">
    <small>Mockup generated by AI Designer</small>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
