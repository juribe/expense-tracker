# Categories explaining how Yogasto processes user information.
name: "Procesamiento de información"
category: security
singleton: true
insert_button: true
max_width_pane: 480
settings:
- label: "Ancla de la sección"
  id: anchor
  type: text
  default: "procesamiento"
- label: "Etiqueta superior"
  id: kicker
  type: text
  default: "Cómo procesamos tu información"
- label: "Título"
  id: title
  type: text
  default: "Transparencia en cada función"
- label: "Descripción"
  id: description
  type: text
  default: "Algunas funcionalidades requieren procesar información para ofrecerte el servicio."
- label: "Título del aviso"
  id: note_title
  type: text
  default: "Más detalle"
- label: "Texto del aviso"
  id: note_text
  type: text
  default: "La Política de privacidad explica los datos, proveedores y plazos de conservación aplicables."
blocks_label: "Categorías de procesamiento"
blocks:
- name: "Categoría"
  type: step
  settings:
  - label: "Número (opcional, ej. 01)"
    id: number
    type: text
    default: ""
  - label: "Título"
    id: title
    type: text
    default: "Gastos, ingresos y movimientos"
  - label: "Descripción"
    id: description
    type: text
    default: "La información financiera que registras se utiliza para organizar tus finanzas, generar informes y realizar análisis."
