# Account-security recommendations for the public security page.
name: "Buenas prácticas de seguridad"
category: security
singleton: true
insert_button: true
max_width_pane: 480
settings:
- label: "Ancla de la sección"
  id: anchor
  type: text
  default: "practicas"
- label: "Etiqueta superior"
  id: kicker
  type: text
  default: "Buenas prácticas"
- label: "Título"
  id: title
  type: text
  default: "La seguridad también es un trabajo compartido"
- label: "Descripción"
