    id: icon
    type: text
    default: "🔐"
  - label: "Título"
    id: title
    type: text
    default: "Usa una contraseña segura"
  - label: "Descripción"
    id: description
    type: text
    default: "Elige una contraseña única y evita reutilizarla en otros servicios."
