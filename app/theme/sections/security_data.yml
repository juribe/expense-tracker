# Two-column section explaining user control over account information.
name: "Control de la información"
category: security
singleton: true
insert_button: true
max_width_pane: 480
settings:
- label: "Ancla de la sección"
  id: anchor
  type: text
  default: "control"
- label: "Etiqueta superior"
  id: kicker
  type: text
  default: "Tu información y tu control"
- label: "Título"
  id: title
  type: text
  default: "Tú decides qué compartes y cuándo"
- label: "Descripción"
  id: description
  type: text
  default: "Puedes consultar tu información, gestionar tus integraciones y ejercer tus derechos."
- label: "Título de la columna de acciones"
  id: kept_title
  type: text
  default: "Puedes hacerlo desde tu cuenta"
- label: "Título de la columna de consideraciones"
  id: not_kept_title
  type: text
  default: "Ten en cuenta"
- label: "Título de la aclaración"
  id: note_title
  type: text
  default: "Transparencia"
- label: "Texto de la aclaración"
  id: note_text
  type: text
  default: "La Política de privacidad describe con más detalle el tratamiento de datos, la conservación y tus derechos."
blocks_label: "Acciones y consideraciones"
blocks:
- name: "Elemento"
  type: item
  settings:
  - label: "Columna"
    id: column
    type: select
    select: ["kept", "not_kept"]
    default: "kept"
  - label: "Texto"
    id: text
    type: text
    default: "Consultar y actualizar la información registrada en tu cuenta."
