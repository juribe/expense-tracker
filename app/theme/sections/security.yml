# Security section: account-protection methods. Only real, current safeguards;
# the note clarifies that methods are optional and no zero-risk guarantee is
# claimed.
name: "Protección de la cuenta"
category: content
singleton: true
max_width_pane: 480
settings:
- label: "Ancla de la sección"
  id: anchor
  type: text
  default: "cuenta"
- label: "Kicker"
  id: kicker
  type: text
  default: "Protección de tu cuenta"
- label: "Título"
  id: title
  type: text
  default: "Protege el acceso a "
- label: "Texto destacado con gradiente"
  id: gradient_text
  type: text
  default: "tu cuenta"
- label: "Descripción"
  id: description
  type: text
  default: "Puedes elegir entre diferentes métodos para iniciar sesión y añadir capas adicionales de protección."
- label: "Nota informativa inferior"
  id: note
  type: text
  default: "Passkeys y TOTP son opcionales. Puedes activarlos desde Perfil > Seguridad de la cuenta cuando estén disponibles en tu cuenta. La disponibilidad también depende de tu dispositivo y navegador."
blocks_label: "Métodos de protección"
blocks:
- name: "Método"
  type: item
  settings:
  - label: "Visible"
    id: visible
    type: checkbox
    default: true
  - label: "Icono (emoji o símbolo)"
    id: icon
    type: text
    default: "🔒"
  - label: "Color del icono"
    id: color
    type: select
    select: ["blue", "purple", "green", "orange", "cyan", "pink"]
    default: "blue"
  - label: "Título"
    id: title
    type: text
    default: "Contraseña"
  - label: "Descripción"
    id: description
    type: text
    default: "Yogasto usa autenticación con contraseña. No almacenamos tu contraseña en texto plano."
