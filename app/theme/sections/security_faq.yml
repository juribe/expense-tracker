# Accessible native accordion for infrastructure, providers and security questions.
name: "Infraestructura y proveedores"
category: security
singleton: true
insert_button: true
max_width_pane: 480
settings:
- label: "Ancla de la sección"
  id: anchor
  type: text
  default: "infraestructura"
- label: "Etiqueta superior"
  id: kicker
  type: text
  default: "Infraestructura y proveedores"
- label: "Título"
  id: title
  type: text
  default: "Dónde se aloja y quiénes participan"
- label: "Descripción"
  id: description
  type: text
  default: "Yogasto utiliza proveedores externos para prestar determinados servicios. Estas son las respuestas principales."
blocks_label: "Preguntas y respuestas"
blocks:
- name: "Pregunta"
  type: question
  settings:
  - label: "Pregunta"
    id: question
    type: text
    default: "¿Dónde se aloja la información de Yogasto?"
  - label: "Respuesta (admite HTML)"
    id: answer
    type: text
    default: "Yogasto se aloja en infraestructura de OVHcloud ubicada en Canadá."
