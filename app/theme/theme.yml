# Yogasto public theme (Maglev CMS)
# The sections replicate 1:1 the design of the marketing home page and add
# content administration through the Maglev editor.
# Please, do not change the id of the theme
id: "theme"

name: "Yogasto"

description: "Tema público de Yogasto: home de marketing editable con Maglev CMS."

section_categories:
- name: navigation
- name: heroes
- name: features
- name: demo
- name: content
- name: cta
- name: institutional
- name: help_center
- name: legal

# Properties of your theme such as the primary color, font name, ...etc.
